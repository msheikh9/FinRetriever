name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # The tests build tiny local models and mock the Hub; nothing may be downloaded from Hugging Face.
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/lock-linux-x86_64-cpu.txt

      - name: Install the pinned environment (CPU PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/lock-linux-x86_64-cpu.txt
          pip install -e . --no-deps
          pip check

      - name: Lint (ruff)
        run: python -m ruff check src tests scripts

      - name: Test (pytest)
        run: python -m pytest
