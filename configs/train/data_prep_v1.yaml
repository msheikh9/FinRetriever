# Leakage-safe training-data preparation for the first bi-encoder experiment (bge_base_ft_v1).
#   python3 scripts/02_generate_queries.py prepare --config configs/train/data_prep_v1.yaml
#   python3 scripts/02_generate_queries.py sources --split train      (source-quality report, offline)
#   python3 scripts/02_generate_queries.py plan --split train --name pilot_v2 --size 24   (versioned pilot plan)
#   python3 scripts/02_generate_queries.py generate --split train --plan pilot_v2 --config configs/train/data_prep_v1.yaml
#       (prints the plan only; add --confirm-api-use with GROQ_API_KEY set to send requests; --continue-run
#       resumes a run whose request settings changed, recording a continuation instead of a new run)
#   python3 scripts/02_generate_queries.py revalidate --split train   (re-run the candidate checks, offline)
#   python3 scripts/02_generate_queries.py build-pairs --config configs/train/data_prep_v1.yaml
# Method and rationale: docs/training_data_v1.md. Evaluation sources give passage IDs only; question texts
# are read only to reject training queries that copy them.

version: bge_base_ft_v1
corpus_path: data/processed/corpus_v1.jsonl
corpus_version: corpus_v1@1.2
corpus_sha256: ff9dadf37bb9820e2c87df70a411fd189bb02776609e5ec06173dd03f2344004
output_dir: data/processed/train/bge_base_ft_v1     # gitignored; never overwritten with different content
min_source_words: 40                                # visible words a passage needs to give queries

overlap:
  shingle_words: 5
  max_shingle_df: 50              # shingles in more passages are boilerplate and give no candidates
  min_shared_shingles: 10         # candidate pairs share at least this many non-boilerplate shingles
  containment_threshold: 0.5      # |A&B| / min(|A|,|B|): an edge, so the pair stays in one group
  near_duplicate_threshold: 0.8   # Jaccard: reported as near-duplicate

blocklist:                        # every listed source must exist and match the frozen corpus
  annotation_workspaces: [data/eval/annotation]
  dev_pools: [data/eval/dev_ai/pilot_v3/pool]
  audit_workspaces: [data/eval/audit/pilot_v1, data/eval/audit/pilot_v3]
  gold_qrels: data/eval/gold_qrels.jsonl
  gold_metadata: data/eval/gold_eval.metadata.json  # required once gold qrels exist

split:
  seed: 20261029
  validation_share: 0.10
  stratify_by: [ticker, fiscal_year]

visible_text:                     # the encoder that will be fine-tuned defines what it can read
  tokenizer: BAAI/bge-base-en-v1.5
  revision: a5beb1e3e68b9ab74eb54cfd186867f64f240e1a
  max_seq_length: 512
  passage_prefix: ""

generation:
  provider: groq
  model: qwen/qwen3.8-27b         # llama-3.3-70b-versatile returned 404 model_not_found for this key
  api_base: https://api.groq.com/openai/v1
  api_key_env: GROQ_API_KEY       # read from the environment only; never stored
  temperature: 0.7                # top of Groq's recommended 0.5-0.7 range for Qwen
  # The token limit, pacing and retry settings are request settings: they never shape an accepted reply, so a
  # change continues the recorded run (generate --continue-run) instead of starting a new one.
  max_completion_tokens: 768      # pilot replies 181-265 tokens, 399 for a numeric exhibit list; was 2048
  output_tokens_per_minute: 1000  # the account's Groq OTPM limit for this model: each request reserves 768
  max_rate_limit_wait_seconds: 180  # a longer wait (e.g. a daily limit) stops the run cleanly instead
  json_mode: true                 # JSON object mode; refused together with reasoning_format raw
  reasoning_format: parsed        # any reasoning goes to message.reasoning, which is ignored
  reasoning_effort: none          # no reasoning tokens: the task is extraction, not problem solving
  queries_per_passage: {train: 2, validation: 1}
  requests_per_minute: 20
  max_retries: 4
  timeout_seconds: 60
  backoff_seconds: 2.0
  max_backoff_seconds: 60
  max_response_attempts: 2
  max_consecutive_failures: 3
  company_aliases:                # names a question may use besides the ticker and the first word
    JPM: ["j.p. morgan", "jp morgan"]
    XOM: ["exxon mobil"]

leakage:
  evaluation_question_files: [data/eval/annotation/questions.jsonl, data/eval/gold_queries.jsonl]
  lexical_overlap_threshold: 0.8  # word-set Jaccard with any evaluation question rejects a query

source_quality:                   # which approved passages are worth generating from (sampling only; the split is unchanged)
  enabled: true
  exhibit_marker_density: 2.5     # exhibit-list markers per 100 words: exhibit index
  cross_reference_share: 0.5      # share of prose words in sentences pointing elsewhere ...
  cross_reference_max_figures: 2.0  # ... with fewer financial figures per 100 words: pure cross reference
  administrative_marker_density: 1.5  # controls, certifications, officer rosters per 100 words ...
  administrative_min_filings: 3   # ... repeated in at least this many filings (overlap group)
  min_finance_term_share: 0.005   # low financial content: fewer finance terms than this share of words,
  min_figures_per_100_words: 1.0  # fewer financial figures,
  min_table_numbers_per_100_words: 3.0  # and fewer table numbers; never applied to the protected items
  protected_items: ["1A", "7", "7A", "8"]  # risk factors, MD&A, market risk, financial statements
